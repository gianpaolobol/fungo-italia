appId: it.fungoitalia.app
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Studio"
    timeout: 60000
- tapOn:
    id: "tab-studio"
- assertVisible: ".*Demo gratuita.*Agaricus.*"
- tapOn:
    text: "Apri .*"
    index: 0
- waitForAnimationToEnd
- takeScreenshot: 01-studio
- tapOn: "Torna alle schede"
- tapOn:
    text: "Esame"
    index: 0
- waitForAnimationToEnd
- assertVisible: "Test Agaricus gratuito"
- assertVisible: "Inizia 4 casi"
# Legacy artifact basename; this capture now shows the free Agaricus test.
- takeScreenshot: 02-aree
- tapOn:
    id: "tab-abbonamento"
- waitForAnimationToEnd
- assertVisible: "Fungo Italia completo"
- takeScreenshot: 03-esame
- scrollUntilVisible:
    element:
      text: "Ripristina acquisti"
    direction: DOWN
- assertVisible: "Ripristina acquisti"
- assertNotVisible: "Inizia 15 casi"
