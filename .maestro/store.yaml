appId: it.fungoitalia.app
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Studio"
    timeout: 60000
- tapOn: "Cerca nome scientifico, comune o sinonimo"
- inputText: "Amanita caesarea"
- hideKeyboard
- tapOn: "Apri Amanita caesarea"
- waitForAnimationToEnd
- takeScreenshot: 01-studio
- tapOn: "Torna alle schede"
- tapOn:
    text: "Aree"
    index: 0
- waitForAnimationToEnd
- takeScreenshot: 02-aree
- tapOn:
    text: "Esame"
    index: 0
- waitForAnimationToEnd
- takeScreenshot: 03-esame
