<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="application-name" content="Fungo Italia"><meta name="theme-color" content="#174f2b"><meta name="apple-mobile-web-app-capable" content="yes"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' blob:; connect-src 'self' https://api.github.com; object-src 'none'; base-uri 'self'; form-action 'none'"><meta name="referrer" content="no-referrer"><link rel="icon" href="./icon.png"><link rel="stylesheet" href="./app.css"><link rel="stylesheet" href="./importa-foto.css"><title>Importa Foto — Fungo Italia</title></head>
<body><header class="brand"><strong>Fungo Italia</strong><a class="button" href="./">Torna all’app</a></header>
<main id="main"><section><h1>Carica immagini</h1><p class="small">Massimo 20 foto per caricamento. Le immagini caricate saranno pubbliche.</p>
<input id="photos" type="file" accept="image/*" multiple hidden>
<p id="queue-count" class="counter" hidden></p><div id="queue" class="photo-queue"></div>
<div id="authorization" hidden><label for="token">Autorizzazione GitHub</label><input id="token" type="password" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false"><p class="small"><a href="https://github.com/settings/personal-access-tokens/new?name=Fungo%20Italia%20Foto&amp;target_name=gianpaolobol&amp;expires_in=7&amp;contents=write" target="_blank" rel="noopener noreferrer">Crea l’autorizzazione</a> per il repository fungo-italia e incollala qui.</p></div>
<button id="upload" class="full">Carica immagini selezionate</button>
<p id="status" role="status" aria-live="polite"></p><p id="error" class="error" role="alert" hidden></p><p id="result" hidden></p>
</section></main><noscript>Attiva JavaScript per caricare le fotografie.</noscript><script type="module" src="./importa-foto.js"></script></body></html>
