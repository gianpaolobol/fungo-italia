name: Revisione micologica indipendente
description: Presentare una decisione documentata su una o più schede dell'atlante
title: "[Revisione micologica] "
labels: ["scientific-review"]
body:
  - type: markdown
    attributes:
      value: |
        La compilazione non certifica automaticamente una scheda. Il curatore verifica identità, credenziali, prove e corrispondenza dello SHA prima di acquisire l'attestazione. Non inserire dati personali sensibili.
        Fascicolo: https://github.com/gianpaolobol/fungo-italia/blob/main/docs/reviews/INDEPENDENT_MICOLOGIST_REVIEW_DOSSIER_20261026.md
  - type: input
    id: reviewer
    attributes:
      label: Revisore e affiliazione professionale
      placeholder: Nome e affiliazione verificabile
    validations:
      required: true
  - type: input
    id: credential
    attributes:
      label: Evidenza pubblica delle competenze professionali
      description: Link istituzionale o professionale; evita documenti di identità nell'issue pubblica
    validations:
      required: true
  - type: input
    id: sha
    attributes:
      label: SHA completo del catalogo esaminato (40 caratteri)
      placeholder: 0123456789abcdef0123456789abcdef01234567
    validations:
      required: true
  - type: textarea
    id: taxa
    attributes:
      label: ID esatti delle schede esaminate
      description: Uno per riga; non includere specie non esaminate
    validations:
      required: true
  - type: dropdown
    id: decision
    attributes:
      label: Decisione
      options:
        - Approvazione proposta
        - Richiesta integrazioni
        - Non approvata
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidenze, pagine e motivazione per ogni scheda
      description: Citare S1, S2 per la commestibilità, fonti ulteriori, fotografie e diritti
    validations:
      required: true
  - type: textarea
    id: discrepancies
    attributes:
      label: Discordanze e correzioni richieste
      description: Specificare singoli ID e campi; se nessuna, scrivere Nessuna
    validations:
      required: true
  - type: checkboxes
    id: declaration
    attributes:
      label: Dichiarazione del revisore
      options:
        - label: Confermo di avere esaminato personalmente le schede e le evidenze dello SHA indicato; comprendo che l'invio non equivale ad approvazione automatica.
          required: true
