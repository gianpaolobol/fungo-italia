name: Recover confirmation of owner TestFlight build 20
on:
  push:
    branches: [audit/confirm-beta20-20261026]
    paths: [.github/workflows/confirm-owner-beta20.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: confirm-owner-beta20
  cancel-in-progress: false
jobs:
  confirm:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      GH_TOKEN: ${{ github.token }}
      APPLICATION_SOURCE: b844fb2cb53b497d5301ad86e737e03886c55a69
    steps:
      - uses: actions/checkout@v4
        with:
          ref: b844fb2cb53b497d5301ad86e737e03886c55a69
      - uses: actions/setup-node@v4
        with:
          node-version: 24.3.0
      - uses: actions/download-artifact@v4
        with:
          name: Consolidated-TestFlight-evidence
          run-id: 40357011280
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}
      - name: Revalidate immutable source, mandatory proofs and completed EAS upload
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {execFileSync} from 'node:child_process';
          import {readFile,writeFile} from 'node:fs/promises';
          import {verifyOwnerBetaScience,assertOwnerScienceReceipt} from './scripts/internal-beta-science.mjs';
          import {candidateReceipt} from './scripts/consolidated-evidence.mjs';
          const source=process.env.APPLICATION_SOURCE;
          assert.equal(execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim(),source);
          assert.equal(execFileSync('git',['status','--porcelain'],{encoding:'utf8'}).trim(),'');
          async function gh(path){const r=await fetch('https://api.github.com/repos/'+process.env.GITHUB_REPOSITORY+path,{headers:{Authorization:'Bearer '+process.env.GH_TOKEN},signal:AbortSignal.timeout(45000)});assert(r.ok,'GitHub proof unavailable '+r.status);return r.json();}
          assert.equal((await gh('/git/ref/heads/main')).object.sha,source,'Main advanced; refuse stale beta');
          const r=JSON.parse(await readFile(process.env.RUNNER_TEMP+'/consolidated-build.json','utf8'));
          for(const [k,v] of Object.entries({appId:'6821140326',bundleId:'it.fungoitalia.app',version:'1.1.0',buildNumber:'20',sourceCommit:source,producerRunId:'40357011280',ipaSha256:'b9870cf8658ebc3154356232e6941340c762561f51de9ba109f2ac3a7c988b7e',testFlightOnly:true,diagnosticOnly:true,appStoreReady:false,nativeStorekitVerified:true,storekitUIVerified:true}))assert.equal(r[k],v,'Wrong signed receipt '+k);
          const science=await verifyOwnerBetaScience(source);assertOwnerScienceReceipt(r,science);assert.deepEqual(r.scientificReview,science);
          await writeFile(process.env.RUNNER_TEMP+'/internal-beta-science.json',JSON.stringify(science,null,2)+'\n');
          const ids=[40357011278,40357011216,40357011285];
          const runs=await Promise.all(ids.map(id=>gh('/actions/runs/'+id)));
          const checked=candidateReceipt({sha:source,native:runs[0],ui:runs[1],demo:runs[2]});assert.deepEqual(r.evidence,checked.evidence);
          const original=await gh('/actions/runs/40357011280');assert.equal(original.head_sha,source);assert.equal(original.head_branch,'main');assert.equal(original.event,'push');assert.equal(original.path,'.github/workflows/consolidated-testflight.yml');
          const job=await gh('/actions/jobs/121727450378');assert.equal(job.run_id,40357011280);
          for(const name of ['Build isolated beta channel with remote build increment','Record signed binary provenance','Verify source inside the signed native app before upload','Revalidate owner review immediately before upload','Preflight existing beta audience before any upload'])assert.equal(job.steps.find(s=>s.name===name)?.conclusion,'success','Original signing gate missing: '+name);
          const query='query OwnerSubmissionStatus($appId:String!){app{byId(appId:$appId){id ownerAccount{name} submissions(filter:{platform:IOS},offset:0,limit:10){id status createdAt completedAt iosConfig{ascAppIdentifier} error{errorCode}}}}}';
          const response=await fetch('https://api.expo.dev/graphql',{method:'POST',headers:{Authorization:'Bearer '+process.env.EXPO_TOKEN,'Content-Type':'application/json'},body:JSON.stringify({query,variables:{appId:'b65af584-739f-4ef0-8fe5-6c0ba692c088'}}),signal:AbortSignal.timeout(45000)});
          assert(response.ok,'EAS readback unavailable');const result=await response.json();assert(!result.errors?.length,'EAS query rejected');const app=result.data?.app?.byId;assert.equal(app?.id,'b65af584-739f-4ef0-8fe5-6c0ba692c088');assert.equal(app.ownerAccount?.name,'gianpaolobol');
          const submission=app.submissions.find(s=>s.id==='f02f940d-07e5-476f-8f83-6ccabb959041');assert.equal(submission?.status,'FINISHED');assert.equal(submission.iosConfig?.ascAppIdentifier,'6821140326');assert(!submission.error);
          r.confirmationRecovery={runId:process.env.GITHUB_RUN_ID,orchestratorCommit:process.env.GITHUB_SHA,originalSubmission:submission.id,submissionStatus:submission.status,completedAt:submission.completedAt};
          await writeFile(process.env.RUNNER_TEMP+'/consolidated-build.json',JSON.stringify(r,null,2)+'\n');
          console.log('Exact signed build 20, mandatory native proofs, unchanged owner science and EAS FINISHED confirmed. No second upload.');
          JS
      - name: Confirm existing owner-only audience
        run: node scripts/consolidated-beta-audience.mjs
      - name: Confirm Apple processing and assign only the owner group
        run: node scripts/verify-consolidated-testflight.mjs
      - name: Require actual internal TestFlight availability
        run: node scripts/release-parity.mjs beta-state
      - name: Preserve final receipt and result
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/owner-beta20-proof"
          cp "$RUNNER_TEMP/consolidated-build.json" "$RUNNER_TEMP/owner-beta20-proof/"
          if test -f "$RUNNER_TEMP/internal-beta-science.json"; then cp "$RUNNER_TEMP/internal-beta-science.json" "$RUNNER_TEMP/owner-beta20-proof/"; fi
          if test -f store-evidence/consolidated-testflight.json; then cp store-evidence/consolidated-testflight.json "$RUNNER_TEMP/owner-beta20-proof/"; fi
          node --input-type=module <<'JS'
          import {readFile,appendFile} from 'node:fs/promises';
          try{const r=JSON.parse(await readFile('store-evidence/consolidated-testflight.json','utf8'));if(r.internalBuildState!=='IN_BETA_TESTING')throw Error('Not available yet');console.log('ACTUAL_OWNER_TESTFLIGHT '+JSON.stringify({sourceCommit:r.sourceCommit,version:r.version,buildNumber:r.buildNumber,appleBuildId:r.appleBuildId,internalBuildState:r.internalBuildState,internalGroupIds:r.internalGroupIds,betaStateVerifiedAt:r.betaStateVerifiedAt}));await appendFile(process.env.GITHUB_STEP_SUMMARY,'Confirmed 1.1.0 (20), '+r.sourceCommit+', IN_BETA_TESTING, owner group only. Independent review pending; no App Store release.\n');}catch(e){console.log('Availability not certified: '+e.message);}
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Owner-TestFlight-build20-final-proof
          path: ${{ runner.temp }}/owner-beta20-proof/
          if-no-files-found: error
          retention-days: 90
