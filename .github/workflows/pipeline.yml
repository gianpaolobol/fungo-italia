name: Expo Android and iOS
on:
  push:
    branches: [main, feat/expo-migration]
    paths-ignore:
      - 'src/data/admin-reference-images.json'
      - 'web/public/images/reference/admin-*.jpg'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: expo-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    permissions:
      contents: write
      actions: read
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      EXPO_PROJECT_ID: ${{ vars.EXPO_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Install and lock dependencies
        run: |
          npm install --package-lock-only && npm ci
      - name: Prepare canonical offline content
        run: |
          npm run prepare:data
          node scripts/validate-mobile-data.mjs
      - name: Check TypeScript
        run: npm run typecheck
      - name: Verify draft integrity and review boundaries
        run: |
          node scripts/test-review-readiness.mjs
          python3 -m py_compile scripts/android-smoke.py
      - name: Export both native bundles
        run: npx expo export --platform ios --platform android --output-dir dist
      - name: Generate Android native project
        run: npx expo prebuild --platform android --no-install
        env:
          CI: '1'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      - name: Build installable preview APK locally
        working-directory: android
        run: ./gradlew :app:assembleRelease --no-daemon --max-workers=2
      - uses: actions/upload-artifact@v4
        with:
          name: Fungo-Italia-Android-APK
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: Fungo-Italia-native-bundles
          path: dist/
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: Fungo-Italia-build-inputs
          path: |
            package-lock.json
            src/data
            assets/icon.png
          if-no-files-found: error
          retention-days: 30
      - name: Preserve generated catalog and dependency lock
        if: github.ref == 'refs/heads/feat/expo-migration'
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add package-lock.json src/data assets/icon.png
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Lock Expo dependencies and canonical offline data [skip ci]"
          git push origin HEAD:feat/expo-migration
  android-smoke:
    permissions:
      contents: write
      actions: read
    needs: android
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Fungo-Italia-Android-APK
          path: artifacts/android
      - name: Install gallery fixture tooling
        run: python3 -m pip install Pillow==11.3.0
      - name: Enable hardware acceleration
        run: sudo chmod 666 /dev/kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: python3 scripts/android-smoke.py
      - name: Register native screenshot for review
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/register-native-evidence.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Fungo-Italia-Android-smoke-evidence
          path: artifacts/smoke
          retention-days: 30
  android-release:
    permissions:
      contents: write
      actions: read
    needs: [android, android-smoke]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Fungo-Italia-Android-APK
          path: artifacts/android
      - name: Publish verified preview APK
        run: |
          cp artifacts/android/app-release.apk artifacts/android/Fungo-Italia.apk
          if gh release view native-preview >/dev/null 2>&1; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/native-preview" -f sha="$GITHUB_SHA" -F force=true
            gh release edit native-preview --title "Fungo Italia — anteprima Android" --notes-file docs/ANDROID-PREVIEW.md --prerelease
            gh release upload native-preview artifacts/android/Fungo-Italia.apk --clobber
          else
            gh release create native-preview artifacts/android/Fungo-Italia.apk --target "$GITHUB_SHA" --title "Fungo Italia — anteprima Android" --notes-file docs/ANDROID-PREVIEW.md --prerelease
          fi
  expo-update:
    needs: android
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EXPO_PROJECT_ID: ${{ vars.EXPO_PROJECT_ID }}
    steps:
      - name: Check Expo configuration presence
        id: account
        run: |
          if test -n "$EXPO_TOKEN" && test -n "$EXPO_PROJECT_ID"; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Expo publication unavailable: GitHub access does not include an Expo account, project ID or token."
          fi
      - uses: actions/checkout@v4
        if: steps.account.outputs.available == 'true'
      - uses: actions/setup-node@v4
        if: steps.account.outputs.available == 'true'
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        if: steps.account.outputs.available == 'true'
        with:
          name: Fungo-Italia-build-inputs
          path: .
      - name: Install identical build dependencies
        if: steps.account.outputs.available == 'true'
        run: npm ci
      - name: Verify Expo account and preview channel
        if: steps.account.outputs.available == 'true'
        run: |
          npx eas-cli@24.8.0 whoami
          npx eas-cli@24.8.0 project:info --json
          if ! npx eas-cli@24.8.0 channel:view preview --non-interactive --json >/dev/null 2>&1; then
            npx eas-cli@24.8.0 channel:create preview --non-interactive --json
          fi
      - name: Publish authenticated native update
        if: steps.account.outputs.available == 'true'
        run: npx eas-cli@24.8.0 update --channel preview --environment preview --platform all --non-interactive --message "GitHub revision $GITHUB_SHA" --json
