name: Expo Android and iOS
on:
  push:
    branches: [main, feat/expo-migration]
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: expo-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      EXPO_PROJECT_ID: ${{ vars.EXPO_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Install and lock dependencies
        run: |
          if test -f package-lock.json; then npm ci; else npm install; fi
      - name: Prepare canonical offline content
        run: |
          npm run prepare:data
          node scripts/validate-mobile-data.mjs
      - name: Check TypeScript
        run: npm run typecheck
      - name: Export both native bundles
        run: npx expo export --platform ios --platform android --output-dir dist
      - name: Generate Android native project
        run: npx expo prebuild --platform android --no-install
        env:
          CI: '1'
      - name: Build installable preview APK locally
        working-directory: android
        run: ./gradlew :app:assembleRelease --no-daemon --max-workers=2
      - uses: actions/upload-artifact@v4
        with:
          name: Fungo-Italia-Android-APK
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: Fungo-Italia-native-bundles
          path: dist/
          retention-days: 30
      - name: Preserve generated catalog and dependency lock
        if: github.ref == 'refs/heads/feat/expo-migration'
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add package-lock.json src/data
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Lock Expo dependencies and canonical offline data [skip ci]"
          git push origin HEAD:feat/expo-migration
  expo-update:
    needs: android
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EXPO_PROJECT_ID: ${{ vars.EXPO_PROJECT_ID }}
    steps:
      - name: Verify Expo account linkage
        id: account
        run: |
          if test -n "$EXPO_TOKEN" && test -n "$EXPO_PROJECT_ID"; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Expo publication unavailable: GitHub access does not include an Expo account, project ID or token."
          fi
      - uses: actions/checkout@v4
        if: steps.account.outputs.available == 'true'
      - uses: actions/setup-node@v4
        if: steps.account.outputs.available == 'true'
        with:
          node-version: '24'
      - name: Install and prepare data
        if: steps.account.outputs.available == 'true'
        run: |
          if test -f package-lock.json; then npm ci; else npm install; fi
          npm run prepare:data
      - name: Publish authenticated native update
        if: steps.account.outputs.available == 'true'
        run: npx eas-cli@latest update --branch preview --environment preview --platform all --non-interactive --json
