name: Scientific generator verification
on:
  push:
    branches:
      - feat/scientific-profile-coverage-oct08
      - release/beta-primary-review-20261008
  pull_request:
    branches:
      - main
  workflow_dispatch:
jobs:
  generator:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.3.0'
          cache: npm
      - run: npm ci
      - name: Generate all atlas datasets
        run: npm run prepare:data
      - name: Check scientific source and toxicology mapping
        run: |
          node scripts/approved-external-study-evidence.test.mjs
          node scripts/toxicology-syndromes.test.mjs
          node scripts/release-readiness.test.mjs
          node scripts/audit-toxicology-release.mjs
      - name: Scientific completeness report (expected blockers during primary-review beta)
        run: |
          node scripts/release-readiness.mjs --json > /tmp/scientific-readiness.json
          node scripts/audit-toxicology-release.mjs
      - name: Strict release gate (scientific certification only)
        if: ${{ github.ref == 'refs/heads/main' }}
        run: |
          npm run validate:release
          node scripts/audit-toxicology-release.mjs --strict
      - name: Check native types
        run: npm run typecheck
      - name: Web build
        run: |
          cd web
          npm ci
          npm run build
      - name: Audit generated content drift (primary-review beta)
        run: |
          git status --short
          if ! git diff --quiet -- src/data/catalog.json src/data/groups.json src/data/provenance.json; then
            echo 'Generated atlas outputs differ from tracked files; preserve generated artifacts and reconcile before publication.'
            git diff --stat -- src/data/catalog.json src/data/groups.json src/data/provenance.json
          fi
          test -s dist-ios/data.json
      - name: Enforce committed generated content (publication only)
        if: ${{ github.ref == 'refs/heads/main' }}
        run: |
          git diff --exit-code -- src/data/catalog.json src/data/groups.json src/data/provenance.json
          test -s dist-ios/data.json
      - name: Preserve build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scientific-generator-evidence
          path: |
            src/data/catalog.json
            src/data/groups.json
            src/data/toxicology-syndromes.json
            dist-ios/data.json
          retention-days: 7

  pwa-browser:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.3.0'
          cache: npm
      - run: npm ci
      - run: npm run prepare:data
      - name: Install PWA dependencies and WebKit
        run: |
          cd web
          npm ci
          npx playwright install --with-deps webkit chromium
      - name: Build PWA with toxicology content
        run: cd web && npm run build
      - name: Run iPhone-sized WebKit tests
        run: cd web && npm test
      - name: Save browser test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scientific-pwa-webkit-report
          path: web/playwright-report
          retention-days: 7

  technical-provenance:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.3.0'
          cache: npm
      - run: npm ci
      - run: npm run prepare:data
      - run: cd web && npm ci && npm run build
      - name: Package reproducible technical build
        run: tar -czf fungo-italia-scientific-preview.tar.gz -C dist-ios .
      - name: Attest source and build provenance
        id: attest
        uses: actions/attest@v4
        with:
          subject-path: fungo-italia-scientific-preview.tar.gz
      - name: Verify signed attestation
        run: gh attestation verify fungo-italia-scientific-preview.tar.gz --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@v4
        with:
          name: signed-scientific-preview
          path: fungo-italia-scientific-preview.tar.gz
          retention-days: 14
