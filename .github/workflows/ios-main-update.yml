name: Publish verified iOS content updates
on:
  workflow_run:
    workflows: ['Expo Android and iOS']
    types: [completed]
permissions:
  contents: read
  actions: read
concurrency:
  group: ios-production-update
  cancel-in-progress: false
jobs:
  publish:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EXPO_PROJECT_ID: b65af584-739f-4ef0-8fe5-6c0ba692c088
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Reuse the exact dependencies and content verified by the native pipeline
        uses: actions/download-artifact@v4
        with:
          name: Fungo-Italia-build-inputs
          path: .
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}
      - run: npm ci
      - name: Validate access policy and native compatibility configuration
        run: |
          npm run typecheck
          node --test scripts/subscription-policy.test.mjs
          npx expo config --type public --json > /tmp/production-expo-config.json
          node -e 'const c=require("/tmp/production-expo-config.json");if(c.ios?.bundleIdentifier!=="it.fungoitalia.app"||c.runtimeVersion?.policy!=="fingerprint"||c.extra?.eas?.projectId!==process.env.EXPO_PROJECT_ID)throw Error("Unexpected production app identity or unsafe runtime policy");console.log("Production identity and fingerprint policy verified")'
      - name: Publish compatible content to the installed iOS app
        run: |
          mkdir -p store-evidence
          npx eas-cli@24.8.0 update --platform ios --channel production --environment production --message "Verified native content ${{ github.event.workflow_run.head_sha }}" --non-interactive --json > store-evidence/production-update.json
          cat store-evidence/production-update.json
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: iOS-production-update-receipt
          path: store-evidence/production-update.json
          retention-days: 30
