name: Build verified subscription for TestFlight
on:
  workflow_run:
    workflows: ['Verify StoreKit purchase interface']
    types: [completed]
permissions:
  contents: read
  actions: read
concurrency:
  group: subscription-production-ios
  cancel-in-progress: false
jobs:
  build:
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'
    runs-on: macos-26
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.4.1.app/Contents/Developer
      NODE_OPTIONS: --max-old-space-size=6144
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EXPO_PROJECT_ID: b65af584-739f-4ef0-8fe5-6c0ba692c088
      SOURCE_BUILD_COMMIT: ${{ github.event.workflow_run.head_sha }}
      VERIFIED_STOREKIT_RUN: ${{ github.event.workflow_run.id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Require successful native and UI StoreKit evidence for the same inputs
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const base='https://api.github.com/repos/'+process.env.GITHUB_REPOSITORY;
          async function get(path) {
            const response=await fetch(base+path,{headers:{Authorization:'Bearer '+process.env.GH_TOKEN,Accept:'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}});
            if(!response.ok)throw Error('GitHub evidence query failed: '+response.status);
            return response.json();
          }
          const trees=new Map();
          const explicit=new Set(['package.json','package-lock.json','app.json','app.config.js','App.tsx','hooks/useSubscription.ts','lib/subscriptionPolicy.ts','tests/storekit/AnnualStoreKitTests.swift','tests/storekit/Annual.storekit','scripts/clean-storekit-test-host.rb','scripts/prepare-storekit-runtime.sh','scripts/add-storekit-tests.rb','.github/workflows/subscription-storekit-tests.yml']);
          async function inputs(sha) {
            if(trees.has(sha))return trees.get(sha);
            const tree=await get('/git/trees/'+sha+'?recursive=1');
            if(tree.truncated)throw Error('Incomplete source tree cannot prove billing equivalence');
            const entries=tree.tree.filter(x=>explicit.has(x.path)||x.path.startsWith('modules/fungo-subscription/')).map(x=>[x.path,x.mode,x.type,x.sha]).sort((a,b)=>a[0].localeCompare(b[0]));
            for(const path of explicit)if(!entries.some(x=>x[0]===path)){trees.set(sha,null);return null;}
            const value=JSON.stringify(entries);trees.set(sha,value);return value;
          }
          const expected=await inputs(process.env.SOURCE_BUILD_COMMIT);
          if(!expected)throw Error('The production source is missing required native test inputs');
          let verified;
          for(let attempt=0;attempt<18;attempt++) {
            const {workflow_runs:runs}=await get('/actions/workflows/subscription-storekit-tests.yml/runs?branch=main&per_page=30');
            let pending=false;
            for(const run of runs.slice(0,12)) {
              if(await inputs(run.head_sha)!==expected)continue;
              if(run.conclusion==='success'){verified=run;break;}
              if(run.status!=='completed'){pending=true;break;}
              throw Error('The latest matching native StoreKit run did not pass: '+run.id+' '+run.conclusion);
            }
            if(verified)break;
            if(!pending)throw Error('No successful native StoreKit run matches the tested production inputs');
            console.log('Waiting for matching native StoreKit evidence');
            await new Promise(resolve=>setTimeout(resolve,20000));
          }
          if(!verified)throw Error('Matching native StoreKit test is not successful yet; rerun this build after it passes');
          console.log('VERIFIED_NATIVE_STOREKIT_RUN '+verified.id);
          fs.appendFileSync(process.env.GITHUB_OUTPUT,'eligible=true\n');
          fs.appendFileSync(process.env.GITHUB_ENV,'VERIFIED_NATIVE_STOREKIT_RUN='+verified.id+'\n');
          JS
      - if: steps.release.outputs.eligible == 'true'
        run: npm ci
      - if: steps.release.outputs.eligible == 'true'
        run: npm run prepare:data && npm run typecheck
      - name: Build the tested source locally on the free GitHub runner
        if: steps.release.outputs.eligible == 'true'
        run: npx eas-cli@24.8.0 build --platform ios --profile production --local --non-interactive --output "$RUNNER_TEMP/fungo-italia-subscription.ipa"
      - name: Record the signed binary version
        if: steps.release.outputs.eligible == 'true'
        run: |
          unzip -q "$RUNNER_TEMP/fungo-italia-subscription.ipa" -d "$RUNNER_TEMP/subscription-binary"
          plist=$(find "$RUNNER_TEMP/subscription-binary/Payload" -maxdepth 2 -name Info.plist -print -quit)
          build_number=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$plist")
          echo "SUBSCRIPTION_IOS_BUILD_NUMBER $build_number"
          echo "EXPECTED_BUILD_NUMBER=$build_number" >> "$GITHUB_ENV"
          short_version=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$plist")
          BUILD_NUMBER="$build_number" BUILD_VERSION="$short_version" node --input-type=module <<'JS'
          import {readFile,writeFile} from 'node:fs/promises';
          import {createHash} from 'node:crypto';
          const bytes=await readFile(process.env.RUNNER_TEMP+'/fungo-italia-subscription.ipa');
          const receipt={appId:'6821140326',bundleId:'it.fungoitalia.app',productId:'it.fungoitalia.premium.annual',buildNumber:process.env.BUILD_NUMBER,version:process.env.BUILD_VERSION,sourceCommit:process.env.SOURCE_BUILD_COMMIT,storekitRunId:process.env.VERIFIED_STOREKIT_RUN,nativeStorekitRunId:process.env.VERIFIED_NATIVE_STOREKIT_RUN,producerRunId:process.env.GITHUB_RUN_ID,createdAt:new Date().toISOString(),ipaSha256:createHash('sha256').update(bytes).digest('hex')};
          await writeFile(process.env.RUNNER_TEMP+'/subscription-build.json',JSON.stringify(receipt,null,2)+'\n');
          JS
      - uses: actions/upload-artifact@v4
        if: steps.release.outputs.eligible == 'true'
        with:
          name: Subscription-signed-build-receipt
          path: ${{ runner.temp }}/subscription-build.json
          retention-days: 30
      - name: Upload the signed binary to TestFlight
        if: steps.release.outputs.eligible == 'true'
        run: npx eas-cli@24.8.0 submit --platform ios --profile production --path "$RUNNER_TEMP/fungo-italia-subscription.ipa" --non-interactive --wait
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Signed-subscription-iOS
          path: ${{ runner.temp }}/fungo-italia-subscription.ipa
          retention-days: 7
          if-no-files-found: warn
