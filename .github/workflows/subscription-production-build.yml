name: Build verified subscription for TestFlight
on:
  workflow_run:
    workflows: ['Verify StoreKit purchase interface']
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: subscription-production-ios
  cancel-in-progress: false
jobs:
  build:
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'
    runs-on: macos-26
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      NODE_OPTIONS: --max-old-space-size=6144
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EXPO_PROJECT_ID: b65af584-739f-4ef0-8fe5-6c0ba692c088
      SOURCE_BUILD_COMMIT: ${{ github.event.workflow_run.head_sha }}
      VERIFIED_STOREKIT_RUN: ${{ github.event.workflow_run.id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Check the corrected StoreKit integration pipeline
        id: release
        run: |
          node --input-type=module -e "import fs from 'node:fs';const s=fs.readFileSync('.github/workflows/subscription-storekit-tests.yml','utf8');fs.appendFileSync(process.env.GITHUB_OUTPUT,'eligible='+s.includes('group: verified-storekit-native-tests')+'\\n');"
      - uses: actions/setup-node@v4
        if: steps.release.outputs.eligible == 'true'
        with:
          node-version: '24'
      - if: steps.release.outputs.eligible == 'true'
        run: npm ci
      - if: steps.release.outputs.eligible == 'true'
        run: npm run prepare:data && npm run typecheck
      - name: Build the tested source locally on the free GitHub runner
        if: steps.release.outputs.eligible == 'true'
        run: npx eas-cli@24.8.0 build --platform ios --profile production --local --non-interactive --output "$RUNNER_TEMP/fungo-italia-subscription.ipa"
      - name: Record the signed binary version
        if: steps.release.outputs.eligible == 'true'
        run: |
          unzip -q "$RUNNER_TEMP/fungo-italia-subscription.ipa" -d "$RUNNER_TEMP/subscription-binary"
          plist=$(find "$RUNNER_TEMP/subscription-binary/Payload" -maxdepth 2 -name Info.plist -print -quit)
          build_number=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$plist")
          echo "SUBSCRIPTION_IOS_BUILD_NUMBER $build_number"
          echo "EXPECTED_BUILD_NUMBER=$build_number" >> "$GITHUB_ENV"
          short_version=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$plist")
          BUILD_NUMBER="$build_number" BUILD_VERSION="$short_version" node --input-type=module <<'JS'
          import {readFile,writeFile} from 'node:fs/promises';
          import {createHash} from 'node:crypto';
          const bytes=await readFile(process.env.RUNNER_TEMP+'/fungo-italia-subscription.ipa');
          const receipt={appId:'6821140326',bundleId:'it.fungoitalia.app',productId:'it.fungoitalia.premium.annual',buildNumber:process.env.BUILD_NUMBER,version:process.env.BUILD_VERSION,sourceCommit:process.env.SOURCE_BUILD_COMMIT,storekitRunId:process.env.VERIFIED_STOREKIT_RUN,producerRunId:process.env.GITHUB_RUN_ID,createdAt:new Date().toISOString(),ipaSha256:createHash('sha256').update(bytes).digest('hex')};
          await writeFile(process.env.RUNNER_TEMP+'/subscription-build.json',JSON.stringify(receipt,null,2)+'\n');
          JS
      - uses: actions/upload-artifact@v4
        if: steps.release.outputs.eligible == 'true'
        with:
          name: Subscription-signed-build-receipt
          path: ${{ runner.temp }}/subscription-build.json
          retention-days: 30
      - name: Upload the signed binary to TestFlight
        if: steps.release.outputs.eligible == 'true'
        run: npx eas-cli@24.8.0 submit --platform ios --profile production --path "$RUNNER_TEMP/fungo-italia-subscription.ipa" --non-interactive --wait
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Signed-subscription-iOS
          path: ${{ runner.temp }}/fungo-italia-subscription.ipa
          retention-days: 7
          if-no-files-found: warn
