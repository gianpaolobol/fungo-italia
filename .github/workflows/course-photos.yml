name: Review authorized course photographs
on:
  push:
    branches: [research/course-photo-extraction]
    paths: ['tools/extract-course-photos.py', '.github/workflows/course-photos.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install gdown==5.2.0 PyMuPDF==1.25.5 Pillow==11.2.1
      - name: Extract authorized photographs for visual review
        run: python tools/extract-course-photos.py
      - uses: actions/upload-artifact@v4
        with:
          name: authorized-course-photo-review
          path: photo-review/
          retention-days: 14
      - name: Save review sheets on research branch only
        run: |
          git config user.name "Fungo Italia automation"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add photo-review/
          git commit -m "Inventory authorized course photos for visual taxon and view review"
          git push origin HEAD:research/course-photo-extraction
