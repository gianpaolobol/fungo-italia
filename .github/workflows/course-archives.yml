name: Inspect large course archives
on:
  push:
    branches: [main, research/large-course-archives]
    paths: ['tools/inspect-course-archives.py', '.github/workflows/course-archives.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install archive reader
        run: python -m pip install gdown==5.2.0 PyMuPDF==1.25.5
      - name: Download and inspect authorized course archives
        run: python tools/inspect-course-archives.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: course-archive-inventory
          path: archive-inventory.json
          if-no-files-found: error
          retention-days: 7
