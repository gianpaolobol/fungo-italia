name: Publish Fungo Italia current main to Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: fungo-italia-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.3.0'
          cache: npm
      - run: npm ci
      - run: npm run prepare:data
      - name: Verify founding guide categories
        run: node --test scripts/study-profiles.test.mjs scripts/edibility-guide.test.mjs scripts/toxicology-syndromes.test.mjs scripts/atlas-field-review.test.mjs scripts/toxicology-coverage.test.mjs scripts/exam-core.test.mjs scripts/micology-display.test.mjs
      - name: Build current PWA
        run: cd web && npm ci && npm run build
      - name: Verify compact iPhone UI and photo exam
        run: cd web && npx playwright install --with-deps webkit chromium && npm test -- tests/ios.spec.mjs tests/exam.spec.mjs
      - name: Check generated site
        run: |
          test -s dist-ios/index.html
          test -s dist-ios/data.json
          node -e "const d=require('./dist-ios/data.json');if(d.catalog.length!==148||d.groups.length!==66||d.examBank.length<15)process.exit(1)"
      - uses: actions/configure-pages@v5
      - name: Verify Pages uses GitHub Actions
        uses: actions/github-script@v7
        with:
          script: |
            const {data: pages} = await github.rest.repos.getPages(context.repo);
            if (pages.build_type !== 'workflow') {
              core.setFailed('Set Settings > Pages > Source to GitHub Actions; branch publishing can overwrite the beta.');
            }
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-ios
      - id: deployment
        uses: actions/deploy-pages@v4
