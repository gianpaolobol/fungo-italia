# Public deployment is owned exclusively by consolidated-testflight.yml.
name: Request paired Fungo Italia release
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: write
jobs:
  request-paired-release:
    runs-on: ubuntu-latest
    steps:
      - name: Request exact-source TestFlight and public release checks
        uses: actions/github-script@v7
        with:
          script: |
            if (context.ref !== 'refs/heads/main') throw new Error('Paired releases require main');
            await github.rest.actions.createWorkflowDispatch({
              ...context.repo,
              workflow_id: 'consolidated-testflight.yml',
              ref: 'main'
            });
