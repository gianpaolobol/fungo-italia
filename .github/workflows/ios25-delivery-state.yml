name: Inspect iOS25 delivery state
on:
  push:
    branches: [audit/ios25-delivery-state-20261029]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: c524b695d51c5e21eb488c564089c0206dd5caad
      - uses: actions/setup-node@v4
        with:
          node-version: '24.3.0'
      - name: Read existing submissions and Apple build without uploading
        run: |
          test -n "$EXPO_TOKEN"
          node --input-type=module <<'JS'
          import {createAppleApi} from './scripts/app-store-connect.mjs';
          const appId='b65af584-739f-4ef0-8fe5-6c0ba692c088';
          const response=await fetch('https://api.expo.dev/graphql',{method:'POST',headers:{Authorization:'Bearer '+process.env.EXPO_TOKEN,'Content-Type':'application/json'},body:JSON.stringify({query:'query($appId:String!){app{byId(appId:$appId){submissions(filter:{},offset:0,limit:50){id status platform createdAt completedAt submittedBuild{id} iosConfig{ascAppIdentifier} error{errorCode message}}}}}',variables:{appId}}),signal:AbortSignal.timeout(45000)});
          if(!response.ok)throw Error('Expo status read failed '+response.status);
          const data=await response.json();if(data.errors)throw Error('Expo status query rejected');
          console.log('IOS25_EAS_DELIVERIES '+JSON.stringify(data.data.app.byId.submissions.filter(x=>x.platform==='IOS').map(x=>({id:x.id,status:x.status,buildId:x.submittedBuild?.id,appId:x.iosConfig?.ascAppIdentifier,createdAt:x.createdAt,completedAt:x.completedAt,error:x.error?.errorCode}))));
          const api=await createAppleApi();
          const found=await api('/v1/builds?filter[app]=6821140326&filter[version]=25&include=preReleaseVersion&limit=10');
          if(!found.ok||found.links?.next)throw Error('Complete Apple build25 read failed');
          console.log('IOS25_APPLE_BUILDS '+JSON.stringify(found.data.map(x=>({id:x.id,build:x.attributes.version,state:x.attributes.processingState,expired:x.attributes.expired,version:found.included?.find(v=>v.id===x.relationships.preReleaseVersion?.data?.id)?.attributes.version}))));
          const groups=await api('/v1/apps/6821140326/betaGroups?limit=200');
          if(!groups.ok||groups.links?.next)throw Error('Complete Apple groups read failed');
          console.log('IOS25_AUDIENCE_FLAGS '+JSON.stringify(groups.data.map(x=>({id:x.id,internal:x.attributes.isInternalGroup,allBuilds:x.attributes.hasAccessToAllBuilds}))));
          JS
