name: Upload verified native App Store screenshots
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['store/screenshots/manifest.json']
permissions:
  contents: read
concurrency:
  group: app-store-connect-administration
  cancel-in-progress: false
jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --check scripts/upload-store-screenshots.mjs
      - name: Upload reviewed native screenshots and verify Apple processing
        run: node scripts/upload-store-screenshots.mjs
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: Apple-verified-screenshots
          path: store-evidence/screenshot-upload.json
          retention-days: 30
