name: Store production build
on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to build
        required: true
        type: choice
        options: [android, ios, all]
permissions:
  contents: read
  actions: read
concurrency:
  group: subscription-production-ios
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EXPO_PROJECT_ID: ${{ vars.EXPO_PROJECT_ID }}
      GH_TOKEN: ${{ github.token }}
      STORE_PLATFORM: ${{ inputs.platform || 'ios' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - name: Validate production source
        run: |
          npm run prepare:data
          npm run typecheck
          node --test scripts/*.test.mjs
      - name: Require strict scientific and exact-main native production proofs
        run: node scripts/production-preflight.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: Production-source-proof
          path: ${{ runner.temp }}/production-source-proof.json
          if-no-files-found: error
      - name: Queue signed production build for binary verification
        run: |
          test -n "$EXPO_TOKEN"
          test -n "$EXPO_PROJECT_ID"
          echo "Queueing production build for $GITHUB_SHA; upload requires separate binary verification"
          npx eas-cli@24.8.0 build --platform "$STORE_PLATFORM" --profile production --non-interactive --wait --json > "$RUNNER_TEMP/production-eas-build.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Production-EAS-build-metadata
          path: ${{ runner.temp }}/production-eas-build.json
          if-no-files-found: warn
          retention-days: 14
