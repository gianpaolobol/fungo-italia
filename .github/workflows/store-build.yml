name: Store production build
on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to build after configuring signing credentials in Expo
        required: true
        type: choice
        options: [android, ios, all]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EXPO_PROJECT_ID: ${{ vars.EXPO_PROJECT_ID }}
      STORE_PLATFORM: ${{ inputs.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - name: Validate production source
        run: |
          npm run prepare:data
          npm run typecheck
          node --test scripts/*.test.mjs
      - name: Queue signed store build
        run: |
          test -n "$EXPO_TOKEN"
          test -n "$EXPO_PROJECT_ID"
          npx eas-cli@24.8.0 build --platform "$STORE_PLATFORM" --profile production --non-interactive --no-wait
