name: Review licensed scientific image sources
on:
  push:
    branches: [research/primary-reference-v7]
    paths: ['tools/search-community-reference-photos.py', '.github/workflows/external-photo-review.yml']
permissions:
  contents: write
concurrency:
  group: primary-source-photo-review-v7
  cancel-in-progress: false
jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install PyMuPDF==1.25.5 Pillow==11.2.1
      - run: python tools/search-community-reference-photos.py
      - run: python tools/review-external-photos.py
      - name: Save candidates for visual and taxonomic review
        run: |
          git config user.name "Fungo Italia automation"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reference-candidates/ src/data/reference-external-source-candidates.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Acquire licensed European observations with documented consensus"
          git push origin HEAD:research/primary-reference-v7
