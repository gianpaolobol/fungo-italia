name: Review licensed scientific image sources
on:
  push:
    branches: [research/targeted-reference-v10]
    paths: ['tools/review-external-photos.py', 'tools/search-targeted-reference-photos.py', 'tools/search-expert-reference-photos.py', 'src/data/reference-external-source-candidates.json', '.github/workflows/external-photo-review.yml']
permissions:
  contents: write
concurrency:
  group: targeted-reference-v10
  cancel-in-progress: false
jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install PyMuPDF==1.25.5 Pillow==11.2.1
      - run: python tools/search-targeted-reference-photos.py
      - run: python tools/review-external-photos.py
      - name: Save candidates for human visual and scientific review
        run: |
          git config user.name "Fungo Italia automation"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reference-candidates/ src/data/reference-external-source-candidates.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Acquire attributed licensed photographs for visual review"
          git push origin "HEAD:refs/heads/research/reviewed-community-$(git rev-parse --short=12 HEAD)"
