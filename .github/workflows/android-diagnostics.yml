name: Diagnose native cold-start
on:
  push:
    branches: [feat/profile-readiness-oct06]
    paths: ['.github/workflows/android-diagnostics.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Fungo-Italia-Android-APK
          path: artifacts/android
          github-token: ${{ github.token }}
          run-id: '37422007664'
      - run: sudo chmod 666 /dev/kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: python3 scripts/android-diagnostics.py
