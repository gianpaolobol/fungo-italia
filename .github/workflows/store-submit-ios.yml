name: Submit existing iOS build
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/store-submit-ios.yml]
permissions:
  contents: read
concurrency:
  group: submit-ios-testflight
  cancel-in-progress: false
jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EXPO_PROJECT_ID: ${{ vars.EXPO_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - name: Upload signed build to TestFlight
        run: |
          test -n "$EXPO_TOKEN"
          test -n "$EXPO_PROJECT_ID"
          npx eas-cli@24.8.0 submit --platform ios --profile production --id 1fdc27d4-cec2-4b9d-bddd-511f1407a5dc --non-interactive --wait
