name: Submit existing iOS build
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: submit-ios-testflight
  cancel-in-progress: false
jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EXPO_PROJECT_ID: ${{ vars.EXPO_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - name: Refuse unverified historical binary submission
        run: |
          echo '::error::This historical submit path has no exact-source binary provenance. Use the paired diagnostic workflow or a separately qualified production promotion; never submit the previous hardcoded build.'
          exit 1
