name: Verify native StoreKit subscriptions
on:
  push:
    branches: [main, fix/app-review-20261021, feat/continuous-mushroom-navigation-20261021]
    paths: ['modules/fungo-subscription/**','hooks/useSubscription.ts','lib/subscriptionPolicy.ts','App.tsx','tests/storekit/AnnualStoreKitTests.swift','tests/storekit/Annual.storekit','scripts/clean-storekit-test-host.rb','scripts/prepare-storekit-runtime.sh','scripts/add-storekit-tests.rb','.github/workflows/subscription-storekit-tests.yml','.github/workflows/consolidated-testflight.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verified-storekit-native-tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: macos-26
    timeout-minutes: 45
    env:
      CI: '1'
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Select a compatible Apple StoreKit simulator runtime
        run: bash scripts/prepare-storekit-runtime.sh
      - name: Prepare real hosted StoreKit tests
        run: |
          npm ci
          npm run prepare:data
          npm run typecheck
          node --test scripts/subscription-policy.test.mjs
          node --input-type=module <<'JS'
          import {readFile,writeFile} from 'node:fs/promises';
          if(process.env.EXPO_PROJECT_ID)throw Error('The isolated native test host must not load production OTA updates');
          const pkg=JSON.parse(await readFile('package.json','utf8'));
          if(pkg.main!=='index.js')throw Error('Unexpected native test entry');
          await writeFile('index.js',"import {registerRootComponent} from 'expo';\nfunction NativeStoreKitTestHost(){return null;}\nregisterRootComponent(NativeStoreKitTestHost);\n");
          console.log('NATIVE_STOREKIT_TEST_HOST_ISOLATED: production Swift verifier retained; React billing starts only in the separate full UI tests');
          JS
          npx expo prebuild --platform ios --no-install
          ruby scripts/add-storekit-tests.rb
          cd ios
          pod install
          cd ..
          ruby scripts/clean-storekit-test-host.rb
      - name: Exercise verified purchase, refund and expiry without an Apple account
        run: |
          mkdir -p store-evidence
          workspace=$(find ios -maxdepth 1 -name '*.xcworkspace' -print -quit)
          xcodebuild -list -json -workspace "$workspace" > store-evidence/test-schemes.json
          node -e 'const p=require("./store-evidence/test-schemes.json");if(!p.workspace.schemes.includes("FungoItaliaStoreKit"))throw Error("StoreKit test scheme missing")'
          udid=$(xcrun simctl create FungoAnnualStoreKit com.apple.CoreSimulator.SimDeviceType.iPhone-16-Pro-Max "$STOREKIT_TEST_RUNTIME")
          xcrun simctl boot "$udid" || true
          xcrun simctl bootstatus "$udid" -b
          workspace=$(find ios -maxdepth 1 -name '*.xcworkspace' -print -quit)
          if ! xcodebuild -workspace "$workspace" -scheme FungoItaliaStoreKit -configuration Release -destination "platform=iOS Simulator,id=$udid" -derivedDataPath storekit-build -parallel-testing-enabled NO -test-timeouts-enabled YES -default-test-execution-time-allowance 600 -maximum-test-execution-time-allowance 600 ARCHS="$(uname -m)" ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO -jobs 3 test > store-evidence/storekit-test.log 2>&1; then
            tail -n 180 store-evidence/storekit-test.log
            exit 1
          fi
          grep -E 'Test Case|Executed|TEST SUCCEEDED' store-evidence/storekit-test.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: StoreKit-native-integration
          path: |
            store-evidence/
            storekit-build/Logs/Test/*.xcresult
          retention-days: 30
