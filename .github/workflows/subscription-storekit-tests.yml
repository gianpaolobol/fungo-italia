name: Verify native StoreKit subscriptions
permissions:
  contents: read
concurrency:
  group: verified-storekit-native-tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: macos-26
    timeout-minutes: 45
    env:
      STOREKIT_RUNTIME_VERSION: '26.2'
      FUNGO_IOS_MANAGED_BETA: '1'
      FUNGO_BETA_SERVICE_URL: 'https://fungo-italia-accessi.gianpaolo-franceschi.chatgpt.site/'
      CI: '1'
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '24'
    - name: Select a compatible Apple StoreKit simulator runtime
      run: bash scripts/prepare-storekit-runtime.sh
    - name: Prepare real hosted StoreKit tests
      run: 'npm ci

        npm run prepare:data

        npm run typecheck

        node --test scripts/subscription-policy.test.mjs

        node --input-type=module <<''JS''

        import {readFile,writeFile} from ''node:fs/promises'';

        if(process.env.EXPO_PROJECT_ID)throw Error(''The isolated native test host must not load production OTA updates'');

        const pkg=JSON.parse(await readFile(''package.json'',''utf8''));

        if(pkg.main!==''index.js'')throw Error(''Unexpected native test entry'');

        await writeFile(''index.js'',"import {registerRootComponent} from ''expo'';\nfunction NativeStoreKitTestHost(){return null;}\nregisterRootComponent(NativeStoreKitTestHost);\n");

        console.log(''NATIVE_STOREKIT_TEST_HOST_ISOLATED: production Swift verifier retained; React billing starts only in the separate full UI tests'');

        JS

        npx expo prebuild --platform ios --no-install

        ruby scripts/add-storekit-tests.rb

        cd ios

        pod install

        cd ..

        ruby scripts/clean-storekit-test-host.rb

        '
    - name: Exercise verified purchase, refund and expiry without an Apple account
      run: "mkdir -p store-evidence\nworkspace=$(find ios -maxdepth 1 -name '*.xcworkspace' -print -quit)\nxcodebuild -list -json -workspace \"$workspace\" > store-evidence/test-schemes.json\nnode -e 'const p=require(\"./store-evidence/test-schemes.json\");if(!p.workspace.schemes.includes(\"FungoItaliaStoreKit\"))throw Error(\"StoreKit test scheme missing\")'\nudid=$(xcrun simctl create FungoAnnualStoreKit com.apple.CoreSimulator.SimDeviceType.iPhone-16-Pro-Max \"$STOREKIT_TEST_RUNTIME\")\nxcrun simctl boot \"$udid\" || true\nxcrun simctl bootstatus \"$udid\" -b\nworkspace=$(find ios -maxdepth 1 -name '*.xcworkspace' -print -quit)\nif ! xcodebuild -workspace \"$workspace\" -scheme FungoItaliaStoreKit -configuration Release -destination \"platform=iOS Simulator,id=$udid\" -derivedDataPath storekit-build -collect-test-diagnostics never -parallel-testing-enabled NO -test-timeouts-enabled YES -default-test-execution-time-allowance 600 -maximum-test-execution-time-allowance 600 ARCHS=\"$(uname -m)\" ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO\
        \ -jobs 3 test > store-evidence/storekit-test.log 2>&1; then\n  tail -n 180 store-evidence/storekit-test.log\n  exit 1\nfi\ngrep -E 'Test Case|Executed|TEST SUCCEEDED' store-evidence/storekit-test.log\n"
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: StoreKit-native-integration
        path: 'store-evidence/

          storekit-build/Logs/Test/*.xcresult

          '
        retention-days: 30
'on':
  pull_request:
    paths:
      - scripts/prepare-storekit-runtime*
      - .github/workflows/subscription-entitlement-probe.yml
      - .github/workflows/subscription-storekit-tests.yml
      - .github/workflows/subscription-storekit-ui.yml
      - .github/workflows/agaricus-demo-ui.yml
  push:
    branches:
    - main
    - feat/managed-beta-build-20261029
    - fix/beta-invitation-only-20261029
    paths:
    - App.tsx
    - index.js
    - app.json
    - app.config.js
    - package.json
    - package-lock.json
    - eas.json
    - assets/**
    - components/**
    - hooks/**
    - lib/**
    - modules/**
    - src/data/**
    - tests/storekit/**
    - scripts/**
    - web/**
    - .github/workflows/consolidated-testflight.yml
    - .github/workflows/subscription-storekit-tests.yml
    - .github/workflows/subscription-storekit-ui.yml
    - .github/workflows/agaricus-demo-ui.yml
  workflow_dispatch: null
