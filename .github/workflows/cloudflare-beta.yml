name: Cloudflare beta deploy

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Unit tests
        run: pnpm test

      - name: Lint
        run: pnpm lint

      - name: Verify Cloudflare credentials
        run: pnpm exec wrangler whoami

      - name: Ensure D1 database exists
        shell: bash
        run: |
          set -euo pipefail
          if ! pnpm exec wrangler d1 info fungo-italia-beta --json > /tmp/d1.json 2>/dev/null; then
            pnpm exec wrangler d1 create fungo-italia-beta --location weur
            pnpm exec wrangler d1 info fungo-italia-beta --json > /tmp/d1.json
          fi
          node <<'NODE'
          const fs = require("fs");
          const info = JSON.parse(fs.readFileSync("/tmp/d1.json", "utf8"));
          const id = info.uuid || info.id || info.database_id;
          if (!id) throw new Error("Impossibile leggere l'ID D1 dalla risposta di Wrangler.");
          const path = "wrangler.jsonc";
          const source = fs.readFileSync(path, "utf8");
          fs.writeFileSync(path, source.replace("00000000-0000-4000-8000-000000000000", id));
          console.log("D1 configurato:", info.name || "fungo-italia-beta");
          NODE

      - name: Ensure private R2 bucket exists
        shell: bash
        run: |
          set -euo pipefail
          if ! pnpm exec wrangler r2 bucket info fungo-italia-private --json >/dev/null 2>&1; then
            pnpm exec wrangler r2 bucket create fungo-italia-private --location weur
          fi

      - name: Apply D1 migrations
        run: pnpm exec wrangler d1 migrations apply fungo-italia-beta --remote --yes

      - name: Build for Cloudflare
        run: pnpm run build:cloudflare

      - name: Deploy Worker
        run: pnpx @vinext/cloudflare deploy --config wrangler.jsonc
