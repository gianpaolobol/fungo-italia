name: Verify owner TestFlight candidate assignment
on:
  push:
    branches: [chore/testflight-group-audit]
    paths: ['.github/workflows/testflight-diagnostic-status.yml','scripts/inspect-testflight-diagnostic.mjs','scripts/testflight-owner-gate.mjs','scripts/testflight-owner-gate.test.mjs','scripts/assign-owner-diagnostic-build.mjs']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --check scripts/inspect-testflight-diagnostic.mjs
      - name: Validate the exact existing owner and diagnostic binary
        run: node --test scripts/testflight-owner-gate.test.mjs
      - name: Assign the diagnostic build only to the verified existing owner group
        run: node scripts/assign-owner-diagnostic-build.mjs
      - name: Read processing and beta distribution metadata without changing it
        if: always()
        run: node scripts/inspect-testflight-diagnostic.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Diagnostic-TestFlight-status
          path: store-evidence/*.json
          retention-days: 14
