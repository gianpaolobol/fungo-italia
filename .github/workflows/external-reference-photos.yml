name: Materialize licensed external reference photographs
on:
  push:
    branches: [feat/external-reference-photos]
    paths:
      - src/data/reference-external-photo-selections.json
      - src/data/reference-external-sources.json
      - source-photo-assets/external/**
      - tools/materialize-external-photos.py
      - .github/workflows/external-reference-photos.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: external-reference-photos-${{ github.ref }}
  cancel-in-progress: false
jobs:
  materialize:
    if: github.ref == 'refs/heads/feat/external-reference-photos'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install image tools
        run: python -m pip install Pillow==11.2.1
      - name: Materialize verified external photo crops
        run: |
          python -m py_compile tools/materialize-external-photos.py tools/materialize-course-photos.py
          python tools/materialize-external-photos.py
      - name: Regenerate atlas and verify provenance
        run: |
          node scripts/prepare-data.mjs
          node scripts/validate-reference-images.mjs
          node scripts/validate-mobile-data.mjs
          node --test scripts/study-profiles.test.mjs
      - name: Save generated photographs for feature review
        run: |
          git config user.name "Fungo Italia automation"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/public/images/reference/ photo-review/ src/data/
          if git diff --cached --quiet; then
            echo "No generated changes."
          else
            git commit -m "Materialize licensed external photographs and source evidence"
            git push origin "HEAD:${{ github.ref_name }}"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: licensed-external-reference-photos
          path: |
            photo-review/external-selected-sheet-*.jpg
            src/data/reference-image-evidence.json
            src/data/reference-image-coverage.json
          retention-days: 14
