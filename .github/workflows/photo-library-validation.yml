name: Photo library technical validation
on:
  push:
    branches: [photo-library]
    paths: ['photo-library/**', 'tools/validate-photo-library.py', '.github/workflows/photo-library-validation.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'Pillow==11.3.0' 'jsonschema==4.25.1'
      - run: python tools/validate-photo-library.py
