name: Build iOS local photo filter
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ios-local-photo-filter
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EXPO_PROJECT_ID: ${{ vars.EXPO_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - name: Validate native linking and source
        run: |
          npm run prepare:data
          npm run typecheck
          node --test scripts/*.test.mjs
      - name: Refuse the deferred photo release path
        run: |
          echo '::error::Personal-photo upload and analysis are deferred by the owner. Preserve the code; use the qualified release process without enabling this feature.'
          exit 1
