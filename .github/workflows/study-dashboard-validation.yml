name: Validate study dashboard
on:
  push:
    branches: [design/study-dashboard-v1-1]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  study:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - run: npm run typecheck
      - run: node --test scripts/*.test.mjs
      - run: npx expo export --platform ios --output-dir dashboard-export
