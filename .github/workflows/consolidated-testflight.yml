name: Consolidated diagnostic TestFlight
permissions:
  contents: read
  actions: read
concurrency:
  group: subscription-production-ios
  cancel-in-progress: false
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    env:
      NODE_OPTIONS: --max-old-space-size=6144
      GH_TOKEN: ${{ github.token }}
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 24.3.0
    - run: npm ci
    - name: Verify all consolidated source and deterministic data
      run: 'npm run prepare:data

        git diff --exit-code -- src/data

        npm run typecheck

        node --test scripts/*.test.mjs

        npx expo export --platform ios --output-dir /tmp/consolidated-export

        '
    - name: Require actual current native, purchase UI and successful demo proofs
      run: node scripts/consolidated-evidence.mjs
    - uses: actions/upload-artifact@v4
      with:
        name: Consolidated-source-proof
        path: ${{ runner.temp }}/consolidated-build.json
        if-no-files-found: error
        retention-days: 30
  beta:
    runs-on: macos-26
    timeout-minutes: 100
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      NODE_OPTIONS: --max-old-space-size=6144
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EXPO_PROJECT_ID: b65af584-739f-4ef0-8fe5-6c0ba692c088
      GH_TOKEN: ${{ github.token }}
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 24.3.0
    - run: npm ci
    - uses: actions/download-artifact@v4
      with:
        name: Consolidated-source-proof
        path: ${{ runner.temp }}
    - name: Build isolated beta channel with remote build increment
      run: npx eas-cli@24.8.0 build --platform ios --profile consolidated-beta --local --non-interactive --output "$RUNNER_TEMP/fungo-consolidated.ipa"
    - name: Record signed binary provenance
      run: 'unzip -q "$RUNNER_TEMP/fungo-consolidated.ipa" -d "$RUNNER_TEMP/consolidated-binary"

        plist=$(find "$RUNNER_TEMP/consolidated-binary/Payload" -maxdepth 2 -name Info.plist -print -quit)

        export BUILD_NUMBER=$(/usr/libexec/PlistBuddy -c ''Print :CFBundleVersion'' "$plist")

        export BUILD_VERSION=$(/usr/libexec/PlistBuddy -c ''Print :CFBundleShortVersionString'' "$plist")

        node --input-type=module <<''JS''

        import fs from ''node:fs'';import {createHash} from ''node:crypto'';

        const file=process.env.RUNNER_TEMP+''/consolidated-build.json'',r=JSON.parse(fs.readFileSync(file));

        if(r.version!==process.env.BUILD_VERSION||r.sourceCommit!==process.env.GITHUB_SHA)throw Error(''Binary/source identity mismatch'');

        Object.assign(r,{buildNumber:process.env.BUILD_NUMBER,producerRunId:process.env.GITHUB_RUN_ID,ipaSha256:createHash(''sha256'').update(fs.readFileSync(process.env.RUNNER_TEMP+''/fungo-consolidated.ipa'')).digest(''hex'')});

        fs.writeFileSync(file,JSON.stringify(r,null,2)+''\n'');

        console.log(''CONSOLIDATED_SIGNED_RECEIPT ''+JSON.stringify(r));

        JS

        main=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)

        test "$main" = "$GITHUB_SHA"

        '
    - name: Preflight existing beta audience before any upload
      run: node scripts/consolidated-beta-audience.mjs
    - name: Prepare authorized Apple submit key
      run: node --input-type=module -e "import {prepareSubmitCredentials} from './scripts/app-store-connect.mjs';await prepareSubmitCredentials();"
    - name: Upload diagnostic binary to TestFlight only
      run: npx eas-cli@24.8.0 submit --platform ios --profile production --path "$RUNNER_TEMP/fungo-consolidated.ipa" --non-interactive --wait
    - name: Confirm Apple processing and confirmed owner group
      run: node scripts/verify-consolidated-testflight.mjs
    - name: Remove temporary submit key
      if: always()
      run: node --input-type=module -e "import {rm} from 'node:fs/promises';await rm(process.env.RUNNER_TEMP+'/fungo-asc-submit.p8',{force:true});"
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: Consolidated-TestFlight-evidence
        path: '${{ runner.temp }}/consolidated-build.json

          store-evidence/consolidated-testflight.json

          '
        retention-days: 30
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: Consolidated-signed-IPA
        path: ${{ runner.temp }}/fungo-consolidated.ipa
        retention-days: 7
        if-no-files-found: warn
    needs: source
'on':
  push:
    branches:
    - main
    paths:
    - .github/workflows/consolidated-testflight.yml
  workflow_dispatch: null
