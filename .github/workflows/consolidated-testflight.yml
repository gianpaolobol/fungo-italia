name: Paired web and diagnostic TestFlight
permissions:
  contents: read
  actions: read
concurrency:
  group: subscription-production-ios
  cancel-in-progress: true
jobs:
  source:
    outputs:
      independent_ready: ${{ steps.science.outputs.independent_ready }}
    runs-on: ubuntu-latest
    timeout-minutes: 110
    env:
      NODE_OPTIONS: --max-old-space-size=6144
      GH_TOKEN: ${{ github.token }}
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.sha }}
    - uses: actions/setup-node@v4
      with:
        node-version: 24.3.0
    - run: npm ci
    - name: Verify all consolidated source and deterministic data
      run: 'npm run prepare:data

        git diff --exit-code

        npm run typecheck

        node --test scripts/*.test.mjs tools/paired-demo*.test.mjs tools/public-demo21*.test.mjs

        npx expo export --platform ios --output-dir /tmp/consolidated-export

        '
    - name: Require browser image matching the exact lockfile
      run: node -e "if(require('./web/package-lock.json').packages['node_modules/@playwright/test'].version!=='1.56.1')throw Error('Browser image/lockfile mismatch')"
    - name: Install deterministic browser dependencies
      run: npm ci --prefix web
    - name: Build one immutable web candidate from shared application
      run: 'node web/build.mjs

        node scripts/release-parity.mjs candidate dist-ios

        '
    - name: Verify legacy workflows in both engines and unified smartphone app
      run: 'cd web

        npm test

        npx playwright test --browser=chromium

        node smoke-unified.mjs

        UNIFIED_BROWSER=webkit node smoke-unified.mjs

        '
    - uses: actions/upload-artifact@v4
      with:
        name: Paired-web-candidate
        path: dist-ios/
        include-hidden-files: true
        if-no-files-found: error
        retention-days: 30
    - name: Require pinned owner review and strict scientific diagnostics for internal beta
      id: science
      run: node scripts/internal-beta-science.mjs
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: Internal-beta-scientific-proof
        path: ${{ runner.temp }}/internal-beta-science.json
        if-no-files-found: error
        retention-days: 30
    - name: Require actual current native, purchase UI and successful demo proofs
      run: node scripts/consolidated-evidence.mjs
    - name: Bind web and native source proof before signing
      run: 'node --input-type=module <<''JS''

        import {readFile,writeFile} from ''node:fs/promises'';

        const path=process.env.RUNNER_TEMP+''/consolidated-build.json'';

        const receipt=JSON.parse(await readFile(path,''utf8''));

        const build=JSON.parse(await readFile(''dist-ios/build.json'',''utf8''));

        if(receipt.sourceCommit!==build.sourceCommit||receipt.version!==build.version)throw Error(''Native/web source identity differs'');

        Object.assign(receipt,{iconSha256:build.iconSha256,webContentHash:build.webContentHash});

        await writeFile(path,JSON.stringify(receipt,null,2)+''\n'');

        JS

        '
    - uses: actions/upload-artifact@v4
      with:
        name: Consolidated-source-proof
        path: ${{ runner.temp }}/consolidated-build.json
        if-no-files-found: error
        retention-days: 30
    container: mcr.microsoft.com/playwright:v1.56.1-noble
  beta:
    runs-on: macos-26
    timeout-minutes: 100
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      NODE_OPTIONS: --max-old-space-size=6144
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EXPO_PROJECT_ID: b65af584-739f-4ef0-8fe5-6c0ba692c088
      GH_TOKEN: ${{ github.token }}
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.sha }}
    - uses: actions/setup-node@v4
      with:
        node-version: 24.3.0
    - run: npm ci
    - uses: actions/download-artifact@v4
      with:
        name: Consolidated-source-proof
        path: ${{ runner.temp }}
    - name: Revalidate owner science proof before signing
      run: node scripts/internal-beta-science.mjs --verify-receipt
    - name: Bind verified source into the isolated EAS build environment
      run: 'git diff --exit-code

        node --input-type=module <<''JS''

        import {readFile,writeFile} from ''node:fs/promises'';

        const source=process.env.GITHUB_SHA;

        if(!/^[a-f0-9]{40}$/.test(source))throw Error(''Exact source required'');

        const config=JSON.parse(await readFile(''eas.json'',''utf8''));

        config.build[''consolidated-beta''].env={...config.build[''consolidated-beta''].env,GITHUB_SHA:source,FUNGO_VERIFIED_SOURCE:source};

        await writeFile(''eas.json'',JSON.stringify(config,null,2)+''\n'');

        JS

        '
    - name: Build isolated beta channel with remote build increment
      run: npx eas-cli@24.8.0 build --platform ios --profile consolidated-beta --local --non-interactive --output "$RUNNER_TEMP/fungo-consolidated.ipa"
    - name: Record signed binary provenance
      run: 'unzip -q "$RUNNER_TEMP/fungo-consolidated.ipa" -d "$RUNNER_TEMP/consolidated-binary"

        plist=$(find "$RUNNER_TEMP/consolidated-binary/Payload" -maxdepth 2 -name Info.plist -print -quit)

        export BUILD_NUMBER=$(/usr/libexec/PlistBuddy -c ''Print :CFBundleVersion'' "$plist")

        export BUILD_VERSION=$(/usr/libexec/PlistBuddy -c ''Print :CFBundleShortVersionString'' "$plist")

        node --input-type=module <<''JS''

        import fs from ''node:fs'';import {createHash} from ''node:crypto'';

        const file=process.env.RUNNER_TEMP+''/consolidated-build.json'',r=JSON.parse(fs.readFileSync(file));

        if(r.version!==process.env.BUILD_VERSION||r.sourceCommit!==process.env.GITHUB_SHA)throw Error(''Binary/source identity mismatch'');

        Object.assign(r,{buildNumber:process.env.BUILD_NUMBER,producerRunId:process.env.GITHUB_RUN_ID,ipaSha256:createHash(''sha256'').update(fs.readFileSync(process.env.RUNNER_TEMP+''/fungo-consolidated.ipa'')).digest(''hex'')});

        fs.writeFileSync(file,JSON.stringify(r,null,2)+''\n'');

        console.log(''CONSOLIDATED_SIGNED_RECEIPT ''+JSON.stringify(r));

        JS

        main=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)

        test "$main" = "$GITHUB_SHA"

        '
    - name: Verify source inside the signed native app before upload
      run: 'export BUILD_VERSION=$(node -p "require(process.env.RUNNER_TEMP+''/consolidated-build.json'').version")

        node scripts/verify-native-source.mjs "$RUNNER_TEMP/consolidated-binary/Payload"


        app=$(find "$RUNNER_TEMP/consolidated-binary/Payload" -maxdepth 1 -name ''*.app'' -print -quit)

        test -n "$app"

        codesign --verify --deep --strict "$app"

        codesign -d --verbose=4 "$app" 2> "$RUNNER_TEMP/native-signature.txt"

        grep -qx ''TeamIdentifier=BX9MDXAHKG'' "$RUNNER_TEMP/native-signature.txt"

        test "$(/usr/libexec/PlistBuddy -c ''Print :CFBundleIdentifier'' "$app/Info.plist")" = ''it.fungoitalia.app''

        '
    - name: Revalidate owner review immediately before upload
      run: node scripts/internal-beta-science.mjs --verify-receipt
    - name: Preflight existing beta audience before any upload
      run: node scripts/consolidated-beta-audience.mjs
    - name: Prepare authorized Apple submit key
      run: node --input-type=module -e "import {prepareSubmitCredentials} from './scripts/app-store-connect.mjs';await prepareSubmitCredentials();"
    - name: Upload diagnostic binary to TestFlight only
      run: node scripts/upload-consolidated-apple.mjs
    - name: Confirm Apple processing and confirmed owner group
      run: node scripts/verify-consolidated-testflight.mjs
    - name: Confirm actual Apple internal beta availability
      run: node scripts/release-parity.mjs beta-state
    - name: Remove temporary submit key
      if: always()
      run: node --input-type=module -e "import {rm} from 'node:fs/promises';for(const p of ['/fungo-asc-submit.p8','/private_keys'])await rm(process.env.RUNNER_TEMP+p,{force:true,recursive:true});"
    - name: Stage exact native receipts
      if: always()
      run: "mkdir -p \"$RUNNER_TEMP/paired-beta-evidence\"\nif test -f \"$RUNNER_TEMP/consolidated-build.json\"; then cp \"$RUNNER_TEMP/consolidated-build.json\" \"$RUNNER_TEMP/paired-beta-evidence/\"; fi\nif test -f \"$RUNNER_TEMP/internal-beta-science.json\"; then cp \"$RUNNER_TEMP/internal-beta-science.json\" \"$RUNNER_TEMP/paired-beta-evidence/\"; fi\nif test -f store-evidence/consolidated-testflight.json; then cp store-evidence/consolidated-testflight.json \"$RUNNER_TEMP/paired-beta-evidence/\"; fi\n\nfor file in apple-upload.log native-signature.txt; do\n  if test -f \"$RUNNER_TEMP/$file\"; then cp \"$RUNNER_TEMP/$file\" \"$RUNNER_TEMP/paired-beta-evidence/\"; fi\ndone\n"
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: Consolidated-TestFlight-evidence
        path: ${{ runner.temp }}/paired-beta-evidence/
        if-no-files-found: error
        retention-days: 30
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: Consolidated-signed-IPA
        path: ${{ runner.temp }}/fungo-consolidated.ipa
        retention-days: 7
        if-no-files-found: warn
    needs: source
  promote-public-web:
    if: github.ref == 'refs/heads/main' && needs.source.outputs.independent_ready == 'true'
    needs:
    - source
    - beta
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: paired-public-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      GH_TOKEN: ${{ github.token }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.sha }}
    - uses: actions/setup-node@v4
      with:
        node-version: 24.3.0
    - uses: actions/download-artifact@v4
      with:
        name: Paired-web-candidate
        path: dist-ios
    - uses: actions/download-artifact@v4
      with:
        name: Consolidated-TestFlight-evidence
        path: ${{ runner.temp }}/paired-beta-evidence
    - name: Validate every original web byte against confirmed native receipt
      run: node scripts/release-parity.mjs promote dist-ios "$RUNNER_TEMP/paired-beta-evidence/consolidated-testflight.json"
    - uses: actions/configure-pages@v5
    - uses: actions/upload-pages-artifact@v3
      with:
        path: dist-ios
    - name: Reject stale candidate immediately before public promotion
      run: 'node --input-type=module <<''JS''

        const r=await fetch(''https://api.github.com/repos/''+process.env.GITHUB_REPOSITORY+''/git/ref/heads/main'',{headers:{Authorization:''Bearer ''+process.env.GH_TOKEN,Accept:''application/vnd.github+json''}});

        if(!r.ok||(await r.json()).object.sha!==process.env.GITHUB_SHA)throw Error(''Main advanced; fresh paired release required'');

        JS

        '
    - name: Promote the original paired candidate
      id: deployment
      uses: actions/deploy-pages@v4
    container: mcr.microsoft.com/playwright:v1.56.1-noble
  published-smoke:
    needs:
    - source
    - beta
    - promote-public-web
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.sha }}
    - uses: actions/setup-node@v4
      with:
        node-version: 24.3.0
    - uses: actions/download-artifact@v4
      with:
        name: Paired-web-candidate
        path: dist-ios
    - uses: actions/download-artifact@v4
      with:
        name: Consolidated-TestFlight-evidence
        path: ${{ runner.temp }}/paired-beta-evidence
    - name: Verify uncached deployed release, icon, manifest and every asset against native receipt
      run: node scripts/release-parity.mjs published dist-ios "$RUNNER_TEMP/paired-beta-evidence/consolidated-testflight.json" "${{ needs.promote-public-web.outputs.page_url }}"
    - name: Verify published smartphone application
      run: 'npm ci --prefix web

        cd web

        UNIFIED_BASE_URL="${{ needs.promote-public-web.outputs.page_url }}" node smoke-unified.mjs

        UNIFIED_BASE_URL="${{ needs.promote-public-web.outputs.page_url }}" UNIFIED_BROWSER=webkit node smoke-unified.mjs

        '
    container: mcr.microsoft.com/playwright:v1.56.1-noble
'on':
  push:
    branches:
    - main
    paths:
    - App.tsx
    - index.js
    - app.json
    - app.config.js
    - package.json
    - package-lock.json
    - eas.json
    - assets/**
    - components/**
    - hooks/**
    - lib/**
    - modules/**
    - src/data/**
    - tests/storekit/**
    - scripts/**
    - web/**
    - .github/workflows/consolidated-testflight.yml
    - .github/workflows/subscription-storekit-tests.yml
    - .github/workflows/subscription-storekit-ui.yml
    - .github/workflows/agaricus-demo-ui.yml
  workflow_dispatch: null
