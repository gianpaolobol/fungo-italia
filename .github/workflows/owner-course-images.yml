name: Review owner-access course photographs
on:
  push:
    branches: [research/course-photo-extraction]
    paths: ['photo-review/owner-image-index.json', 'tools/review-owner-course-images.py', '.github/workflows/owner-course-images.yml']
permissions:
  contents: write
jobs:
  contacts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==11.2.1
      - run: python tools/review-owner-course-images.py
      - name: Save visually reviewable sheets on research branch
        run: |
          git config user.name "Fungo Italia automation"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add photo-review/
          git commit -m "Render owner-access course-image contact sheets and provenance"
          git push origin HEAD:research/course-photo-extraction
