name: Inspect oversized native screenshot
on:
  push:
    branches: [main]
    paths: ['.github/workflows/inspect-native-screenshot.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Expose the unmodified PNG in text chunks for visual review
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'JS'
          import {createHash} from 'node:crypto';
          const base='https://api.github.com/repos/'+process.env.GITHUB_REPOSITORY;
          const headers={Authorization:'Bearer '+process.env.GH_TOKEN,Accept:'application/vnd.github+json','Content-Type':'application/json'};
          const source='2c26cbbddbb7feca35d5dfdb5c6f51a8b07b3b7b';
          const response=await fetch(base+'/git/blobs/'+source,{headers});
          if(!response.ok)throw Error('Source read failed');
          const file=await response.json();
          const bytes=Buffer.from(file.content,'base64');
          if(bytes.length!==1965456||createHash('sha256').update(bytes).digest('hex')!=='c29364ef5ec38a2a8949aea32ff77e4c832ee617bc9d924a29c926527d823aa3')throw Error('Source mismatch');
          if(bytes[25]!==2)throw Error('RGB PNG required');
          console.log('ORIGINAL_PNG_VERIFIED '+JSON.stringify({width:bytes.readUInt32BE(16),height:bytes.readUInt32BE(20),colorType:bytes[25]}));
          const encoded=bytes.toString('base64');
          for(let offset=0,index=0;offset<encoded.length;offset+=900000,index++){
            const content=encoded.slice(offset,offset+900000);
            const r=await fetch(base+'/git/blobs',{method:'POST',headers,body:JSON.stringify({encoding:'utf-8',content})});
            if(!r.ok)throw Error('Chunk staging failed');
            const blob=await r.json();
            console.log('REVIEW_CHUNK '+JSON.stringify({path:'screenshot-review/part-'+index+'.txt',sha:blob.sha,index,length:content.length}));
          }
          JS
