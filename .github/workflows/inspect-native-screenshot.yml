name: Inspect subscription UI diagnostics
on:
  push:
    branches: [main]
    paths: ['.github/workflows/inspect-native-screenshot.yml']
  workflow_dispatch:
permissions:
  actions: read
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read the failed simulator UI evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'JS'
          import {writeFile} from 'node:fs/promises';
          const base='https://api.github.com/repos/'+process.env.GITHUB_REPOSITORY,headers={Authorization:'Bearer '+process.env.GH_TOKEN,Accept:'application/vnd.github+json'};
          const r=await fetch(base+'/actions/runs/38862121517/artifacts',{headers});if(!r.ok)throw Error('Cannot list evidence');
          const artifact=(await r.json()).artifacts.find(a=>a.name==='Native-App-Store-screenshots');
          const zip=await fetch(artifact.archive_download_url,{headers});if(!zip.ok)throw Error('Cannot download evidence');
          await writeFile('/tmp/ui-evidence.zip',Buffer.from(await zip.arrayBuffer()));
          JS
          mkdir -p /tmp/ui-evidence
          unzip -q /tmp/ui-evidence.zip -d /tmp/ui-evidence
          node --input-type=module <<'JS'
          import {readFile,readdir} from 'node:fs/promises';
          const walk=async(dir)=>{const files=[];for(const f of await readdir(dir,{withFileTypes:true})){const p=dir+'/'+f.name;if(f.isDirectory())files.push(...await walk(p));else files.push(p);}return files;};
          const files=await walk('/tmp/ui-evidence');console.log('UI_EVIDENCE_FILES '+JSON.stringify(files));
          const base='https://api.github.com/repos/'+process.env.GITHUB_REPOSITORY,headers={Authorization:'Bearer '+process.env.GH_TOKEN,Accept:'application/vnd.github+json','Content-Type':'application/json'};
          for(const f of files.filter(f=>/maestro/.test(f)&&/\.json$|\.xml$/.test(f))){const c=await readFile(f,'utf8');console.log('UI_DIAGNOSTIC '+f+' '+c.slice(0,35000));}
          for(const f of files.filter(f=>/\.png$/.test(f)).slice(0,3)){const bytes=await readFile(f);const r=await fetch(base+'/git/blobs',{method:'POST',headers,body:JSON.stringify({encoding:'base64',content:bytes.toString('base64')})});if(!r.ok)throw Error('Cannot stage screenshot');const b=await r.json();console.log('UI_DIAGNOSTIC_BLOB '+JSON.stringify({path:'diagnostic/'+f.split('/').at(-1),sha:b.sha,bytes:bytes.length}));}
          JS
