name: Profile readiness native validation
on:
  push:
    branches: [feat/profile-readiness-oct06]
permissions:
  contents: read
jobs:
  native:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Regenerate the missing media-library lock entry
        run: npm install
      - name: Verify reproducible dependency installation
        run: npm ci
      - run: npm run prepare:data
      - run: npm run typecheck
      - run: python3 -m py_compile scripts/android-smoke.py
      - run: node scripts/test-review-readiness.mjs
      - run: npx expo export --platform ios --platform android --output-dir dist
      - name: Preserve verified dependency lock
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add package-lock.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Lock validated photo and review dependencies [skip ci]"
          git push origin HEAD:feat/profile-readiness-oct06
