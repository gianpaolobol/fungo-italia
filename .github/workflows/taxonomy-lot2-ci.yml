name: Taxonomy Lotto 2 CI

on:
  push:
    branches:
      - feat/stable-learning-taxonomy-v1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22.16.0"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node --experimental-strip-types scripts/verify-index-fungorum.mjs
      - run: node --experimental-strip-types scripts/report-minimum-genera.mjs
      - run: pnpm test
      - run: pnpm lint
      - run: pnpm build
