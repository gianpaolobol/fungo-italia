name: iPhone hosting capability
on:
  push:
    branches: [feat/ios-pwa]
    paths: [.github/workflows/ios-hosting-probe.yml]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  hosting:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/configure-pages@v5
        with:
          enablement: true
