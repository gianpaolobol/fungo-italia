name: Validate shared web candidate
permissions:
  contents: read
concurrency:
  group: iphone-pwa-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-test:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.62.0-noble
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '24'
    - name: Install shared app dependencies
      run: npm ci
    - name: Install isolated web dependencies
      working-directory: web
      run: 'npm ci

        '
    - name: Validate browser code and build offline package
      run: 'node --check web/public/app.js

        node --check web/public/admin-photos.js

        node --check web/public/admin-photo-core.js

        node --test scripts/study-profiles.test.mjs scripts/commercialization.test.mjs scripts/admin-reference-images.test.mjs
        scripts/admin-photo-core.test.mjs

        node --check web/public/importa-foto.js

        node --check web/public/photo-core.js

        node --check web/public/sw.js

        python3 -m py_compile tools/validate-photo-library.py

        node scripts/validate-reference-images.mjs

        node scripts/validate-admin-reference-images.mjs

        node web/build.mjs

        '
    - name: Verify iPhone workflows at 320 points
      working-directory: web
      run: npm test
    - name: Verify shared Areas and actual map identification in both engines
      working-directory: web
      run: 'node smoke-unified.mjs

        UNIFIED_BROWSER=webkit node smoke-unified.mjs

        '
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: Fungo-Italia-iPhone-test-evidence
        path: 'web/test-results

          web/playwright-report

          '
        retention-days: 30
    - uses: actions/upload-artifact@v4
      with:
        name: Fungo-Italia-iPhone-PWA
        path: dist-ios/
        if-no-files-found: error
        retention-days: 30
    - name: Preserve actual map responses and private identification regression evidence
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: Shared-map-browser-evidence
        path: 'web/unified-map-*.png

          web/unified-map-proof-*.json

          web/map-identification-proof-*.json'
        retention-days: 90
        if-no-files-found: warn
  native-source-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '24'
    - run: npm ci
    - run: npm run prepare:data
    - run: node scripts/validate-mobile-data.mjs
    - run: npm run typecheck
    - run: node scripts/test-review-readiness.mjs
    - run: python3 -m py_compile scripts/android-smoke.py
'on':
  push:
    branches:
    - main
    paths:
    - App.tsx
    - app.*
    - package*.json
    - components/**
    - hooks/**
    - lib/**
    - src/data/**
    - web/**
    - assets/**
    - .github/workflows/ios-pwa.yml
  workflow_dispatch: null
