name: iPhone PWA and Expo Go
on:
  push:
    branches: [main, feat/ios-pwa]
    paths:
      - 'web/**'
      - 'components/**'
      - 'App.tsx'
      - 'src/data/**'
      - 'assets/icon.png'
      - '.github/workflows/ios-pwa.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: iphone-pwa-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-test:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install isolated web dependencies
        working-directory: web
        run: |
          if test -f package-lock.json; then npm ci; else npm install; fi
      - name: Validate browser code and build offline package
        run: |
          node --check web/public/app.js
          node --check web/public/sw.js
          node web/build.mjs
      - name: Install WebKit
        working-directory: web
        run: npx playwright install --with-deps webkit chromium
      - name: Verify iPhone workflows at 320 points
        working-directory: web
        run: npm test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Fungo-Italia-iPhone-test-evidence
          path: |
            web/test-results
            web/playwright-report
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: Fungo-Italia-iPhone-PWA
          path: dist-ios/
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-ios/
      - name: Lock tested web dependencies
        if: github.ref == 'refs/heads/feat/ios-pwa'
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add web/package-lock.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Lock tested iPhone PWA dependencies [skip ci]"
          git push origin HEAD:feat/ios-pwa
  expo-go-preview:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install preview tooling
        working-directory: web
        run: npm install
      - name: Publish compatible anonymous Expo Go preview
        working-directory: web
        run: node snack-publish.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Fungo-Italia-iPhone-Expo-Go
          path: iphone-preview/
          if-no-files-found: error
          retention-days: 30
  hosting-check:
    if: github.ref == 'refs/heads/main'
    needs: build-test
    permissions:
      contents: read
      pages: read
    runs-on: ubuntu-latest
    outputs:
      available: ${{ steps.pages.outputs.available }}
    steps:
      - name: Check configured hosting without changing repository visibility
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/$GITHUB_REPOSITORY/pages" >/dev/null 2>&1; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::PWA tested; Pages is not configured or accessible. Enabling Pages requires repository administration access outside this integration."
          fi
  publish:
    if: needs.hosting-check.outputs.available == 'true'
    needs: [build-test, hosting-check]
    permissions:
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Publish verified iPhone PWA
        id: deployment
        uses: actions/deploy-pages@v4
  promote-tested-version:
    if: github.ref == 'refs/heads/feat/ios-pwa'
    needs: [build-test, expo-go-preview]
    permissions:
      contents: write
      actions: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Promote verified source without overwriting newer changes
        env:
          TESTED_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch origin main feat/ios-pwa
          candidate=$(git rev-parse origin/feat/ios-pwa)
          if test "$candidate" != "$TESTED_SHA"; then
            parent=$(git rev-parse "$candidate^")
            changed=$(git diff --name-only "$TESTED_SHA" "$candidate")
            if test "$parent" != "$TESTED_SHA" || test "$changed" != "web/package-lock.json"; then
              echo "::error::Branch changed after validation. Refusing to promote untested source."
              exit 1
            fi
          fi
          git merge-base --is-ancestor origin/main "$candidate"
          git push origin "$candidate:refs/heads/main"
          gh api --method POST "repos/$GITHUB_REPOSITORY/actions/workflows/pipeline.yml/dispatches" -f ref=main
          gh api --method POST "repos/$GITHUB_REPOSITORY/actions/workflows/ios-pwa.yml/dispatches" -f ref=main
