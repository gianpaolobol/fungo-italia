name: Materialize verified reference photographs
on:
  push:
    branches: [feat/study-layout-oct07]
    paths: ['tools/materialize-course-photos.py', 'src/data/reference-photo-selections.json', '.github/workflows/reference-photos.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: reference-photos-${{ github.ref }}
  cancel-in-progress: false
jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python -m pip install gdown==5.2.0 PyMuPDF==1.25.5 Pillow==11.2.1
      - name: Materialize visually reviewed source photographs
        run: python tools/materialize-course-photos.py
      - name: Regenerate canonical atlas and check provenance
        run: |
          node scripts/prepare-data.mjs
          node scripts/validate-mobile-data.mjs
          node --test scripts/study-profiles.test.mjs
      - name: Save photographs on feature branch for final review
        run: |
          git config user.name "Fungo Italia automation"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/public/images/reference/ photo-review/ src/data/
          git commit -m "Import visually reviewed teacher photographs and image evidence"
          git push origin HEAD:feat/study-layout-oct07
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verified-reference-photos
          path: |
            photo-review/
            src/data/reference-image-evidence.json
          retention-days: 14
