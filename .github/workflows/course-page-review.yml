name: Review source page attribution
on:
  push:
    branches: [research/course-photo-extraction]
    paths: ['tools/render-course-pages.py', '.github/workflows/course-page-review.yml']
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install gdown==5.2.0 PyMuPDF==1.25.5 Pillow==11.2.1
      - run: python tools/render-course-pages.py
      - name: Save reviewed source page evidence
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add photo-review/pages
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Save source page attribution review"
          git push origin HEAD:research/course-photo-extraction
