name: iPhone Photo Library Build
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ios-photo-library:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EXPO_PROJECT_ID: ${{ vars.EXPO_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check required Expo configuration
        run: |
          test -n "$EXPO_TOKEN" || { echo "::error::EXPO_TOKEN missing"; exit 1; }
          test -n "$EXPO_PROJECT_ID" || { echo "::error::EXPO_PROJECT_ID missing"; exit 1; }
      - name: Install dependencies
        run: npm ci
      - name: Validate source
        run: |
          npm run prepare:data
          npm run typecheck
      - name: Build installable iPhone app
        run: npx eas-cli@24.8.0 build --platform ios --profile iphone-library --non-interactive --no-wait
