name: iPhone Photo Library Build
# Expo project linked; EXPO_PROJECT_ID is supplied by GitHub Actions variable.
# Trigger after repository variable correction.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'App.tsx'
      - 'components/**'
      - 'src/**'
      - 'app.json'
      - 'app.config.js'
      - 'eas.json'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/iphone-photo-library.yml'
permissions:
  contents: read
jobs:
  ios-photo-library:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EXPO_PROJECT_ID: ${{ vars.EXPO_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check required Expo configuration
        id: expo
        run: |
          if test -n "$EXPO_TOKEN" && test -n "$EXPO_PROJECT_ID"; then echo "available=true" >> "$GITHUB_OUTPUT"; else echo "available=false" >> "$GITHUB_OUTPUT"; echo "::warning::Expo credentials missing; source validation will still run."; fi
      - name: Install dependencies
        run: |
          npm install --package-lock-only
          npm ci
      - name: Validate source
        run: |
          npm run prepare:data
          npm run typecheck
      - name: Diagnose EAS Apple device registration
        if: steps.expo.outputs.available == 'true'
        continue-on-error: true
        run: |
          echo "=== EAS project ==="
          npx eas-cli@24.8.0 project:info
          echo "=== Registered Apple devices / teams ==="
          npx eas-cli@24.8.0 device:list --json --non-interactive

      - name: Build installable iPhone app
        if: steps.expo.outputs.available == 'true'
        run: npx eas-cli@24.8.0 build --platform ios --profile iphone-library --non-interactive --no-wait
