name: Verify iPhone export source
on:
  push:
    branches: [feat/iphone-shortcut-export]
    paths: ['automation/shortcuts/**', '.github/workflows/iphone-shortcut.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python automation/shortcuts/build.py
      - run: python -m unittest discover -s automation/shortcuts -p 'test_*.py'
      - uses: actions/upload-artifact@v4
        with:
          name: UNINSTALLABLE-unsigned-shortcut-review
          path: shortcut-output/
